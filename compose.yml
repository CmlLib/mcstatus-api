services:
  mcstatus-api:
    image: ksi12345ab/mcstatus-api
    environment:
      - CACHE_BACKEND=${CACHE_BACKEND:-redis}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-10}
      - REDIS_URL=redis://redis:6379
    ports:
      - "8000:8000"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
